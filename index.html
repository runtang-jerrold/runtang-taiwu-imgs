<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>润棠太吾绘卷 Mod 静态图床</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #fff8f0 0%, #fef0e6 100%);
      color: #2c2c2c;
      margin: 0;
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      color: #b94d3c;
      border-bottom: 2px dashed #d49b9b;
      padding-bottom: 12px;
    }
    .subtitle {
      color: #6c6c6c;
      font-size: 14px;
      margin-top: -8px;
      margin-bottom: 32px;
    }
    .version {
      background: white;
      border: 1px solid #e6c8b0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(185, 77, 60, 0.06);
    }
    .version h2 {
      font-size: 20px;
      color: #8b3a2a;
      margin-top: 0;
    }
    .category {
      margin-bottom: 16px;
    }
    .category h3 {
      font-size: 16px;
      color: #b94d3c;
      margin: 12px 0 8px 0;
    }
    .image-card {
      display: inline-block;
      margin: 8px 12px 8px 0;
      padding: 12px;
      background: #fdf6f0;
      border: 1px solid #f0d9c4;
      border-radius: 8px;
      max-width: 280px;
    }
    .image-card img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      display: block;
    }
    .image-card .meta {
      margin-top: 8px;
      font-size: 12px;
      color: #6c6c6c;
    }
    .image-card code {
      background: #f0e2d0;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      word-break: break-all;
      display: block;
      margin-top: 4px;
    }
    .footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid #e6c8b0;
      color: #8b8b8b;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>润棠太吾绘卷 Mod 静态图床</h1>
  <p class="subtitle">返老还童丹强化 Mod · 永久图床 · 用于 Steam Workshop 描述引用</p>

  <div class="version">
    <h2>v1.0.0.5</h2>

    <div class="category">
      <h3>主图</h3>
      <div class="image-card">
        <img src="v1.0.0.5/主图/Mod展示图_small.jpg" alt="Mod展示图">
        <div class="meta">
          <strong>Mod展示图(三栏横版)</strong>
          <code>v1.0.0.5/主图/Mod展示图_small.jpg</code>
        </div>
      </div>
      <div class="image-card">
        <img src="v1.0.0.5/主图/祛除玄灰主图_small.jpg" alt="祛除玄灰主图">
        <div class="meta">
          <strong>祛除玄灰主图</strong>
          <code>v1.0.0.5/主图/祛除玄灰主图_small.jpg</code>
        </div>
      </div>
    </div>

    <div class="category">
      <h3>详情页</h3>
      <div class="image-card">
        <img src="v1.0.0.5/详情页/详情页_small.jpg" alt="详情页">
        <div class="meta">
          <strong>超长详情页</strong>
          <code>v1.0.0.5/详情页/详情页_small.jpg</code>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>URL 结构: <code>https://&lt;分享链接&gt;/v&lt;版本号&gt;/&lt;分类&gt;/&lt;文件名&gt;.jpg</code></p>
    <p>Steam 描述用法: <code>[img]&lt;完整 URL&gt;[/img]</code></p>
  </div>
</body>
</html>
